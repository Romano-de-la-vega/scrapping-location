<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Location appartement et maison Lyon 6e | Seventee</title>
  </head>
  <body>
    <a
      data-testid="goToOffer"
      href="/offers/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
    >Annonce située hors de la liste</a>

    <section id="offers">
      <a
        data-testid="goToOffer"
        href="/offers/11111111-1111-4111-8111-111111111111?utm_source=test&amp;offer=keep#pictures"
      >
        <div data-testid="offerPicture" aria-label="Ce div n'est pas une image"></div>
        <img
          data-testid="offerPicture"
          src="first.webp"
          alt="Appartement meublé Lyon 6e"
        >
        Exclusivité Seventee 740,00 € 30.21 m² Meublé 69006 Lyon
      </a>

      <a
        data-testid="goToOffer"
        href="/offers/22222222-2222-4222-8222-222222222222"
        title="Appartement rue Boileau"
      >
        <img data-testid="offerPicture" src="second.webp" alt="Photo du bien">
        719,00 € 36.5 m² 39 rue Boileau - 69006 LYON
      </a>

      <a
        data-testid="goToOffer"
        href="/offers/33333333-3333-4333-8333-333333333333"
        aria-label="Grand appartement Lyon"
      >
        <img data-testid="offerPicture" src="third.webp" alt="Grand appartement">
        780 € 102 m² 4 pièces 69006 Lyon
      </a>

      <a
        data-testid="goToOffer"
        href="/offers/11111111-1111-4111-8111-111111111111?duplicate=kept"
      >
        <img data-testid="offerPicture" src="duplicate.webp" alt="Doublon">
        740 € 30,21 m² 69006 Lyon
      </a>

      <a data-testid="goToOffer" href="/other/not-an-offer">
        Cette ancre ne correspond pas au chemin observé.
      </a>
      <div data-testid="goToOffer" href="/offers/not-an-anchor">
        Ce div n'est pas une carte offre.
      </div>
    </section>
  </body>
</html>
